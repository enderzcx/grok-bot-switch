name: Independent mode
on:
  push:
    branches: [main, codex/independent-mode]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: python3 -m unittest discover -s tests
      - run: node --test tests/*.test.mjs
      - run: python3 desktop/build_independent_bundle.py --output runtime/independent-delivery
      - name: Isolated Linux install, idempotence and stop
        shell: bash
        run: |
          set -euo pipefail
          cd runtime/independent-delivery
          sha256sum -c SHA256SUMS.txt
          digest=$(cut -d ' ' -f 1 SHA256SUMS.txt)
          root="$RUNNER_TEMP/gbs-independent"
          python3 -I GrokBotSwitch-independent.zip install --root "$root" --port 0 --sha256 "$digest"
          python3 -I GrokBotSwitch-independent.zip install --root "$root" --port 0 --sha256 "$digest"
          python3 -I GrokBotSwitch-independent.zip status --root "$root"
          python3 -I GrokBotSwitch-independent.zip stop --root "$root"
      - uses: actions/upload-artifact@v4
        with:
          name: GrokBotSwitch-independent
          path: runtime/independent-delivery/
          if-no-files-found: error
